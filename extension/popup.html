<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgentSpy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <strong>AgentSpy</strong>
        <span class="subtitle">ChatGPT search-query inspector</span>
      </div>
      <div class="actions">
        <button id="copy-csv" title="Copy as CSV">CSV</button>
        <button id="copy-json" title="Copy as JSON">JSON</button>
        <button id="clear" title="Clear all captured data" class="danger">Clear</button>
      </div>
    </header>

    <div id="empty" class="empty">
      <p>No queries captured yet.</p>
      <p class="hint">
        Open <code>chatgpt.com</code>, ask something with web search enabled,
        and the reformulated queries will appear here automatically.
      </p>
    </div>

    <main id="list"></main>

    <footer>
      <span id="count">0 records</span>
      <a href="https://chatgpt.com" target="_blank" rel="noopener">Open ChatGPT</a>
    </footer>
  </body>
  <script src="popup.js"></script>
</html>
